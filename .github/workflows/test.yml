name: test

# One run per pull request: a single Linux job on Node 22. The suite is the gate
# for main; a squash merge produces the tree the PR already tested, so main is
# not tested a second time. Draft pull requests are skipped, so marking one
# ready is the run. Only Linux is exercised here; the code sticks to portable
# APIs (docs/ARCHITECTURE.md, principle 7) but nothing in CI checks macOS or
# Windows.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - "assets/**"
      - "ROADMAP.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # The version comes from package.json#packageManager (single source of truth).
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test
